<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Marathon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: broadcast stage (canvas) on top, race-bib paper panels beneath; one centred column, max 1100px. Single committed look: asphalt + bib paper. */
:root{
  --asphalt:#2b2e33; --asphalt-2:#383c43; --asphalt-3:#4a4f57;
  --paper:#f7f5ef; --paper-2:#ebe7dc; --ink:#17191c; --ink-soft:#5d6168;
  --bib-red:#e2412b; --route-blue:#2a6fe0; --ok:#1f8a4c; --bad:#c23a2b; --warn:#d38b12;
  --f-display:'Unbounded','Arial Black',sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--asphalt);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{max-width:1100px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--route-blue);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.06em;color:var(--paper)}
.brand span{color:var(--bib-red)}
.route{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.route .leg{display:flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9aa0a8}
.route .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--asphalt-3)}
.route .leg.done .dot{background:var(--bib-red);border-color:var(--bib-red)}
.route .leg.now{color:var(--paper)} .route .leg.now .dot{border-color:var(--paper)}
.route .sep{width:14px;height:2px;background:var(--asphalt-3)}
.topbtns{display:flex;gap:8px}
.chip{background:var(--asphalt-2);color:var(--paper);border:0;border-radius:6px;padding:7px 12px;font:600 12px var(--f-body)}
.chip:hover{background:var(--asphalt-3)}

.stagewrap{width:min(100%,max(560px,calc((100vh - 300px) * 16 / 9)));margin-inline:auto}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:#111;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
@media (max-width:640px){.stage{aspect-ratio:4/3}.stagewrap{width:100%}}

.cloud{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);max-width:44%;padding:.8em 1.1em;border-radius:46% 52% 48% 50% / 58% 55% 50% 52%;font:600 clamp(11px,1.75vw,18px)/1.3 var(--f-body);text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:pop .35s ease-out}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.cloud::after{width:1.1em;height:1.1em;left:38%;bottom:-1.3em}
.cloud::before{width:.6em;height:.6em;left:33%;bottom:-2.2em}
@keyframes pop{from{transform:translate(-50%,-90%) scale(.85);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}

.titleov{position:absolute;left:5%;top:9%;max-width:62%}
.titleov h1{margin:0;font:900 clamp(30px,7vw,78px)/.95 var(--f-display);letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.titleov h1 span{color:var(--bib-red)}
.titleov p{margin:.5em 0 0;font:600 clamp(12px,1.8vw,19px)/1.3 var(--f-body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}

.toast{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.45em 1em;border-radius:6px;font:700 clamp(11px,1.6vw,16px) var(--f-body);white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.toast.good{background:var(--ok)} .toast.bad{background:var(--bad)}
.prompt{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:.4em .9em;border-radius:999px;font:700 clamp(11px,1.6vw,16px) var(--f-body);white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.prompt kbd{font:700 .85em var(--f-mono);background:var(--ink);color:#fff;border-radius:4px;padding:.1em .4em;margin-right:.4em}
.count{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(60px,14vw,150px)/1 var(--f-display);color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.3)}
.pauseov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,22,25,.6);pointer-events:auto}
.pauseov div{text-align:center;display:grid;gap:12px}
.pauseov b{font:800 clamp(22px,4vw,40px) var(--f-display)}
.pbtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px) * 0);right:10px;pointer-events:auto;background:rgba(23,25,28,.7);color:#fff;border:0;border-radius:6px;width:38px;height:38px;font:800 14px var(--f-mono)}

/* race-bib panels: paper with punched safety-pin holes */
.bib{position:relative;background:
  radial-gradient(circle at 14px 14px,var(--asphalt) 4.5px,transparent 5.5px),
  radial-gradient(circle at calc(100% - 14px) 14px,var(--asphalt) 4.5px,transparent 5.5px),
  radial-gradient(circle at 14px calc(100% - 14px),var(--asphalt) 4.5px,transparent 5.5px),
  radial-gradient(circle at calc(100% - 14px) calc(100% - 14px),var(--asphalt) 4.5px,transparent 5.5px),
  var(--paper);
  color:var(--ink);border-radius:10px;padding-block:22px;padding-inline:clamp(18px,4vw,34px)}
.eyebrow{font:700 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
h2.q{margin:.25em 0 .7em;font:800 clamp(18px,2.6vw,26px)/1.2 var(--f-display);text-wrap:balance}
.qhead{margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px 24px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:auto 110px 28px;gap:4px 8px;align-items:center;font:600 12px var(--f-body)}
.stats .bar{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.stats .bar i{display:block;height:100%;background:var(--ink)}
.stats .n{font:700 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:2px solid var(--ink);border-radius:8px;background:transparent;color:var(--ink);font:500 15px/1.35 var(--f-body);min-width:0}
.opt b{font:700 13px/1.6 var(--f-mono);background:var(--ink);color:var(--paper);border-radius:4px;padding:0 .45em;flex:none}
.opt:hover{background:var(--ink);color:var(--paper)} .opt:hover b{background:var(--bib-red)}
.resp{margin:0 0 12px;font-size:16px;max-width:65ch}
.deltas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.delta{font:700 12px var(--f-mono);padding:4px 8px;border-radius:4px;background:var(--paper-2)}
.delta.up{background:#d7ecdf;color:var(--ok)} .delta.down{background:#f6dcd7;color:var(--bad)}
.btn{border:0;border-radius:8px;padding:12px 20px;font:700 15px var(--f-body);background:var(--ink);color:var(--paper)}
.btn:hover{background:#000}
.btn.red{background:var(--bib-red);color:#fff} .btn.red:hover{background:#c5321e}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.intro h2{margin:.15em 0 .3em;font:900 clamp(22px,3.6vw,36px)/1.1 var(--f-display)}
.intro .fact{margin:0 0 16px;max-width:65ch;color:var(--ink-soft)}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.cols>*{min-width:0}
.tlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.tlist li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tlist .st{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-soft);margin-top:1px;display:grid;place-items:center;font:800 11px/1 var(--f-mono);color:#fff}
.tlist li.active .st{border-color:var(--route-blue);background:var(--route-blue)}
.tlist li.done .st{border-color:var(--ok);background:var(--ok)}
.tlist li.fail .st{border-color:var(--bad);background:var(--bad)}
.tlist li.fail span.tx{color:var(--ink-soft);text-decoration:line-through}
.tlist .live{font:700 12px var(--f-mono);color:var(--route-blue)}
.keys{font-size:13px;color:var(--ink-soft);display:grid;gap:3px}
.keys kbd{font:700 11px var(--f-mono);background:var(--paper-2);color:var(--ink);border-radius:4px;padding:1px 6px}

.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--asphalt-3);border-radius:8px;overflow:hidden}
.hud>div{background:var(--asphalt-2);padding:8px 12px;min-width:0}
.hud .l{font:700 10px var(--f-mono);letter-spacing:.12em;color:#9aa0a8;text-transform:uppercase}
.hud .v{font:700 clamp(16px,2.4vw,24px)/1.15 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .v small{font-size:.55em;color:#9aa0a8}
.hud .zone-ok{color:#6ad08f} .hud .zone-hi{color:#ff7b62} .hud .zone-lo{color:#8fb8ff}
.ebar{height:8px;background:var(--asphalt);border-radius:4px;overflow:hidden;margin-top:6px}
.ebar i{display:block;height:100%;background:#6ad08f;transition:width .2s}
@media (max-width:640px){.hud{grid-template-columns:repeat(3,1fr)} .hud>.wide{grid-column:span 3}}
.racebot{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media (max-width:760px){.racebot{grid-template-columns:1fr}.racebot .ctrl{order:-1}}
.racebot>*{min-width:0}
.coach{font-size:15px;margin:4px 0 10px;min-height:2.6em}
.coach b{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--bib-red);margin-right:6px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.cbtn{border:0;border-radius:10px;min-height:58px;background:var(--asphalt-2);color:var(--paper);font:700 15px var(--f-body);display:grid;place-items:center;line-height:1.15;padding:6px;touch-action:none}
.cbtn small{font:600 10px var(--f-mono);color:#9aa0a8;letter-spacing:.06em}
.cbtn:active,.cbtn.on{background:var(--asphalt-3)}
.cbtn.act{background:var(--paper);color:var(--ink)} .cbtn.act small{color:var(--ink-soft)}
.cbtn.jmp{background:var(--bib-red);color:#fff} .cbtn.jmp small{color:#ffd9d2}
.pacebox{grid-column:span 2;background:var(--asphalt-2);border-radius:10px;padding:8px 12px}
.pacebox .lbl{display:flex;justify-content:space-between;font:700 11px var(--f-mono);letter-spacing:.08em;color:#9aa0a8;text-transform:uppercase}
.pacebox .lbl b{color:var(--paper)}
.pmeter{height:10px;border-radius:5px;margin-top:6px;background:linear-gradient(90deg,#8fb8ff 0 35%,#6ad08f 35% 68%,#ffb547 68% 85%,#ff7b62 85%);position:relative}
.pmeter i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 2px var(--asphalt)}

.result h2{margin:.1em 0 0;font:900 clamp(22px,3.6vw,34px)/1.1 var(--f-display)}
.rtime{font:700 clamp(34px,6vw,56px)/1 var(--f-mono);font-variant-numeric:tabular-nums;margin:10px 0 4px}
.medal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font:900 26px var(--f-display);color:#5a4100;background:radial-gradient(circle at 35% 30%,#fff3b8,#e8b931 45%,#b8860b);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.2);position:relative;margin-top:26px}
.medal::before{content:"";position:absolute;top:-30px;left:50%;width:34px;height:36px;transform:translateX(-50%);background:var(--rib,#e2412b);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);z-index:-1}
.stars{font-size:26px;letter-spacing:4px;color:#d9d3c3} .stars .on{color:#e8a817}
.rhead{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.legs{display:grid;gap:8px;margin-top:8px}
.legrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--paper-2)}
.legrow .nm{font-weight:700} .legrow .sub{font:600 12px var(--f-mono);color:var(--ink-soft)}
.legrow .tm{font:700 14px var(--f-mono);font-variant-numeric:tabular-nums}
.legrow button{padding:7px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">MARA<span>THON</span></div>
    <nav class="route" id="route" aria-label="Марафоны"></nav>
    <div class="topbtns"><button class="chip" id="bMute">Звук: вкл</button><button class="chip" id="bMenu">Меню</button></div>
  </header>

  <div class="stagewrap"><div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ov">
      <div class="titleov" id="titleov" hidden><h1>MARA<span>THON</span></h1><p>От дивана до финиша пяти великих марафонов</p></div>
      <div class="cloud" id="cloud" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <div class="prompt" id="prompt" hidden></div>
      <div class="count" id="count" hidden></div>
      <button class="pbtn" id="bPause" hidden aria-label="Пауза">II</button>
      <div class="pauseov" id="pauseov" hidden><div><b>Пауза</b><div class="row" style="justify-content:center"><button class="btn red" id="bResume">Продолжить</button><button class="btn" id="bQuit" style="background:#fff;color:var(--ink)">Сойти с дистанции</button></div></div></div>
    </div>
  </div></div>

  <section class="bib" id="pTitle" hidden></section>
  <section class="bib" id="pQuest" hidden></section>
  <section class="bib intro" id="pIntro" hidden></section>
  <section id="pRace" hidden>
    <div class="hud">
      <div><div class="l">Дистанция</div><div class="v" id="hKm">0.0<small> / 42.2 км</small></div></div>
      <div><div class="l">Время</div><div class="v" id="hTime">0:00:00</div></div>
      <div><div class="l">Пульс</div><div class="v" id="hHr">110</div></div>
      <div><div class="l">Темп</div><div class="v" id="hPace">—<small> /км</small></div></div>
      <div class="wide"><div class="l">Энергия <span id="hEnN">100</span></div><div class="ebar"><i id="hEn" style="width:100%"></i></div></div>
    </div>
    <div class="racebot" style="margin-top:12px">
      <div class="bib">
        <div class="eyebrow">Тренер в наушнике</div>
        <p class="coach" id="coach"><b>Тренер</b>На старт!</p>
        <div class="eyebrow">Задания</div>
        <ul class="tlist" id="tasks"></ul>
      </div>
      <div class="ctrl">
        <div class="pacebox"><div class="lbl"><span>Темп</span><b id="paceLbl">средний</b></div><div class="pmeter"><i id="pMark" style="left:50%"></i></div></div>
        <button class="cbtn" id="cSlow">− Медленнее<small>← / A</small></button>
        <button class="cbtn" id="cFast">Быстрее +<small>→ / D</small></button>
        <button class="cbtn act" id="cAct">Действие<small>E / ↓</small></button>
        <button class="cbtn jmp" id="cJump">Прыжок<small>ПРОБЕЛ / ↑</small></button>
      </div>
    </div>
  </section>
  <section class="bib result" id="pResult" hidden></section>
  <section class="bib" id="pEnd" hidden></section>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let W=960,SC=1;const H=540;
const PXKM=1300,TOTAL=Math.round(42.195*PXKM);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(n,s=0){const x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fmtT(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function fmtPace(sec){if(!isFinite(sec)||sec<=0||sec>1200)return '—';let m=Math.floor(sec/60),x=Math.round(sec%60);if(x===60){m++;x=0;}return m+':'+String(x).padStart(2,'0');}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*k);g=Math.round(g*k);b=Math.round(b*k);return `rgb(${clamp(r,0,255)},${clamp(g,0,255)},${clamp(b,0,255)})`;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= DATA ================= */
const STATN={form:'Форма',health:'Здоровье',head:'Тактика'};
const RACES=[
 {id:'msk',name:'Московский марафон',city:'Москва',short:'МСК',bib:1001,
  sky:['#86b4dc','#e8edee'],lm:'#7f91a6',lite:'#a9b7c6',sky2:'#9fb1c3',accent:'#d63a2e',trees:['#d9822b','#e3b23c','#b5532a','#9a7d2e'],weather:'leaves',blue:false,hills:[],diff:1.0,
  fact:'Старт и финиш — у стадиона «Лужники». Трасса идёт по набережным Москвы-реки и мимо Кремля.',
  landmarks:[{km:0.2,f:'luzhniki',label:'Лужники'},{km:8,f:'mgu',label:'МГУ на Воробьёвых горах'},{km:17,f:'kremlin',label:'Кремль'},{km:24,f:'basil',label:'Собор Василия Блаженного'},{km:41.9,f:'luzhniki',label:'Лужники — финиш'}],
  tasks:[{type:'water',km:5},{type:'pulse',km:10,to:15,lo:150,hi:165},{type:'photo',km:17.3,place:'Кремля'},{type:'banana',km:20},{type:'help',km:27}]},
 {id:'ber',name:'Берлинский марафон',city:'Берлин',short:'BER',bib:2002,
  sky:['#94c2e8','#f2ecdc'],lm:'#868c99',lite:'#aab0bb',sky2:'#a9b7c4',accent:'#1f6fd6',trees:['#4f8a3a','#6aa04a','#3d7034'],weather:'none',blue:true,hills:[],diff:1.15,
  fact:'Одна из самых быстрых трасс мира: здесь не раз ставили мировые рекорды. Финиш — сразу за Бранденбургскими воротами.',
  landmarks:[{km:0.3,f:'siegessaule',label:'Колонна Победы'},{km:12,f:'tvtower',label:'Телебашня на Александерплац'},{km:28,f:'siegessaule',label:'Тиргартен'},{km:41.4,f:'gate',label:'Бранденбургские ворота'}],
  tasks:[{type:'time',limit:15000},{type:'water',km:5},{type:'gel',km:25},{type:'pulse',km:28,to:34,lo:155,hi:168},{type:'photo',km:41.1,place:'Бранденбургских ворот'}]},
 {id:'lon',name:'Лондонский марафон',city:'Лондон',short:'LON',bib:3003,

/* ================= RACE SETUP ================= */
function taskLabel(t){switch(t.type){
  case 'water':return `Выпей воды на пункте питания, ${t.km} км`;
  case 'banana':return `Съешь банан на пункте питания, ${t.km} км`;
  case 'gel':return `Возьми гель на ${t.km} км`;
  case 'pulse':return `Держи пульс ${t.lo}–${t.hi} с ${t.km} по ${t.to} км`;
  case 'cap':return `На ${t.place} пульс не выше ${t.hi}`;
  case 'help':return `Помоги упавшему бегуну (≈${Math.round(t.km)} км)`;
  case 'photo':return `Помаши фотографу у ${t.place}`;
  case 'fans':return `Дай пять трём болельщикам ${t.place}`;
  case 'time':return `Финишируй быстрее ${fmtT(t.limit).slice(0,-3)}`;}}
function taskCoach(t){switch(t.type){
  case 'water':return `Через пару километров пункт питания. У столов с водой жми «Действие» — бери стакан.`;
  case 'banana':return `На ${t.km}-м км будут бананы — вторая часть стола. Съешь один, углеводы пригодятся после 30-го.`;
  case 'gel':return `На ${t.km}-м км раздают гели. Возьми один — последняя часть стола.`;
  case 'pulse':return `С ${t.km} по ${t.to} км держи пульс ${t.lo}–${t.hi}. Регулируй темп кнопками − и +.`;
  case 'cap':return `Впереди подъём на ${t.place}. Пульс не выше ${t.hi} — сбавь темп заранее.`;
  case 'help':return `Впереди кто-то упал. Остановись рядом и помоги подняться — кнопка «Действие».`;
  case 'photo':return `У ${t.place} стоит фотограф. Вбеги в фотозону и помаши!`;
  case 'fans':return `Болельщики ${t.place} тянут руки. Дай пять троим!`;
  case 'time':return `Цель на сегодня — быстрее ${fmtT(t.limit).slice(0,-3)}. Не забывай про питание.`;}}

function makeRace(race,opt={}){
  const st=G.stats,rnd=rng(race.bib*7+3);
  const R={race,dist:opt.demo?0:-140,speed:0,pace:.5,hr:opt.demo?140:96,maxE:70+st.health*.4,energy:0,sim:0,t:0,jumpY:0,vy:0,onGround:true,phase:0,stumble:0,help:0,posing:0,five:0,flash:0,count:opt.demo?0:3.4,finished:false,finT:0,demo:!!opt.demo,
    obstacles:[],stations:[],specials:[],tasks:[],npcs:[],parts:[],toastT:0,lastLm:''};
  R.energy=R.maxE;
  // skyline
  R.sky=[];let x=0;while(x<1800){const w=40+rnd()*90,h=50+rnd()*170;R.sky.push([x,w,h,rnd()]);x+=w+rnd()*12;}R.skyW=x;
  if(!opt.demo){
    for(let k=5;k<=40;k+=5){const items=['water'];if(k%10===0)items.push('banana');if(k===25||k===35)items.push('gel');const sx=k*PXKM;R.stations.push({km:k,x:sx,len:items.length*260,secs:items.map((it,i)=>({item:it,x0:sx+i*260,x1:sx+i*260+260,taken:false}))});}
    race.tasks.forEach(tt=>{const t=Object.assign({},tt,{status:'wait',inT:0,totT:0,over:0,count:0});t.label=taskLabel(t);R.tasks.push(t);
      if(t.type==='help'){t.sp={kind:'fallen',x:t.km*PXKM,state:'down',task:t,shirt:['#2f9e8f','#6d4bb0','#e0a21a'][R.tasks.length%3]};R.specials.push(t.sp);}
      if(t.type==='photo'){t.sp={kind:'photo',x:t.km*PXKM,len:320,done:false,task:t};R.specials.push(t.sp);}
      if(t.type==='fans'){t.sp={kind:'fans',x:t.km*PXKM,len:460,count:0,task:t};R.specials.push(t.sp);}
      if(t.type==='time')t.status='active';});
    // obstacles
    const zones=[[-500,900],[TOTAL-700,TOTAL+500]];R.stations.forEach(s=>zones.push([s.x-260,s.x+s.len+220]));R.specials.forEach(s=>zones.push([s.x-260,s.x+(s.len||60)+220]));

function nearAction(){

    if(s.kind==='fallen'&&s.state==='down'&&d>s.x-190&&d<s.x+40)return {label:'Помочь бегуну',run:()=>{R.help=1.8;R.helpObj=s;s.state='helping';R.speed=Math.min(R.speed,80);beep(440,.1);}};

    if(s.kind==='fans'&&s.count<3&&d>s.x&&d<s.x+s.len)return {label:'Дать пять',run:()=>{if(R.five>0)return;s.count++;R.five=.3;beep(700+s.count*120,.07);if(s.count>=3)taskDone(s.task,'Три «пятюни»! Болельщики ревут.');else toast('Пять! '+s.count+'/3');}};

}
function takeItem(st,sec){sec.taken=true;const val={water:6,banana:14,gel:12}[sec.item];R.energy=Math.min(R.maxE,R.energy+val);beep(880,.08);beep(1320,.08,'square',.04,.07);
  const t=R.tasks.find(t=>t.type===sec.item&&t.km===st.km);if(t)taskDone(t,{water:'Вода выпита. Дальше — ровный темп.',banana:'Банан съеден. Энергии хватит до финиша.',gel:'Гель есть! Запей водой на следующем пункте.'}[sec.item]);else toast('+'+val+' энергии','good');}

function doJump(){if(!R||R.demo||R.count>0||R.finished||R.help>0||!R.onGround)return;R.vy=-640;R.onGround=false;beep(520,.06,'triangle',.06);}

function updateRace(dt){
  const st=G.stats,race=R.race;R.t+=dt;
  if(R.toastT>0){R.toastT-=dt;if(R.toastT<=0)$('#toast').hidden=true;}
  if(R.count>0){const prev=Math.ceil(R.count);R.count-=dt;const now=Math.ceil(R.count);const el=$('#count');
    if(R.count<=0){el.hidden=true;beep(990,.35,'square',.06);setCoach('Старт! Первые километры — спокойно, разгоняйся постепенно.');}
    else{el.hidden=false;el.textContent=now>3?'':now;if(now!==prev&&now<=3)beep(520,.12,'square',.05);}
    stepNpcs(dt);stepParts(dt);return;}
  if(keys.left)R.pace=Math.max(0,R.pace-dt*.55);if(keys.right)R.pace=Math.min(1,R.pace+dt*.55);
  const km=kmOf(R.dist),hill=inHill(R,km);
  let base=(230+R.pace*250)*(.9+st.form/500);
  if(hill)base*=.9;
  if(R.energy<=0)base=Math.min(base,150);else if(R.energy<15)base=Math.min(base,250);
  if(R.stumble>0){R.stumble-=dt;base*=.4;}
  if(R.help>0){R.help-=dt;base=0;R.sim+=dt*25;if(R.help<=0)finishHelp();}
  if(R.posing>0)R.posing-=dt;if(R.five>0)R.five-=dt;if(R.flash>0)R.flash-=dt*2.5;
  if(R.finished){base=0;R.finT+=dt;}
  R.speed+=(base-R.speed)*Math.min(1,dt*(R.help>0?6:2.5));
  const dx=R.speed*dt;R.dist+=dx;const dk=dx/PXKM;
  if(!R.finished&&R.dist>0){const p=R.speed>20?clamp(450-(R.speed-200)*.62,200,900):0;R.sim+=dk*p;if(R.stumble>0)R.sim+=dt*5;}
  // heart rate
  let hrT=112+R.pace*72+(km/42)*10+(hill?13:0)+(R.energy<15?6:0);
  if(R.help>0||R.finished)hrT=118;
  R.hr+=(hrT-R.hr)*dt*(.45+st.head/100*.9);
  // energy
  if(!R.finished){const drain=2.0*(1.25-st.form/200)*(1+Math.max(0,R.hr-162)/12);R.energy=Math.max(0,R.energy-drain*dk);}
  // jump
  if(!R.onGround){R.vy+=1900*dt;R.jumpY-=R.vy*dt;if(R.jumpY<=0){R.jumpY=0;R.onGround=true;R.vy=0;}}
  R.phase+=dt*(R.speed/40);
  // collisions
  for(const o of R.obstacles){if(o.hit||o.x+o.w<R.dist-20)continue;if(o.x>R.dist+30)break;
    if(R.dist+12>o.x&&R.dist-12<o.x+o.w&&R.jumpY<o.h-4){o.hit=true;const soft=o.type==='puddle';R.stumble=soft?.5:.9;const pen=(soft?2:4)+(100-st.health)*(soft?.03:.06);R.energy=Math.max(0,R.energy-pen);
      beep(140,.2,'sawtooth',.05);toast({cone:'Споткнулся о конус!',puddle:'Поскользнулся в луже!',bottles:'Наступил на бутылки!',barrier:'Врезался в барьер!'}[o.type]+' −'+Math.round(pen),'bad');}}
  // tasks
  for(const t of R.tasks){
    if(t.status==='wait'&&km>=t.km-((t.type==='pulse'||t.type==='cap')?1:1.8)){t.status='active';tasksDirty=true;setCoach(taskCoach(t));beep(600,.06,'triangle',.05);}
    if(t.status!=='active')continue;
    if(t.type==='water'||t.type==='banana'||t.type==='gel'){const s=R.stations.find(s=>s.km===t.km);if(s&&R.dist>s.x+s.len+60)taskFail(t,'Пункт питания пропущен. Следи за подсказками у столов.');}
    else if(t.type==='help'){if(t.sp.state==='down'&&R.dist>t.sp.x+260)taskFail(t,'Ты пробежал мимо. На марафоне так не делают.');}
    else if(t.type==='photo'||t.type==='fans'){const s=t.sp;if(R.dist>s.x+s.len+60)taskFail(t,t.type==='photo'?'Фотограф снял только твою спину.':'Болельщики остались без «пятюни».');}

    else if(t.type==='cap'){if(km>=t.km&&km<t.to&&R.hr>t.hi){t.over+=dt;if(t.over>4)taskFail(t,'Пульс выше нормы на подъёме — сил потрачено слишком много.');}

  }

  if(!R.finished&&R.dist>=TOTAL){R.finished=true;R.finalTime=R.sim;R.tasks.forEach(t=>{if(t.type==='time'){R.sim<=t.limit?taskDone(t,'Цель по времени выполнена!'):taskFail(t,'Не уложился в целевое время.');}else if(t.status!=='done')t.status='fail';});tasksDirty=true;

  stepNpcs(dt);stepParts(dt);
}

  else{const o=Q.opt,sum=Object.values(o.fx).reduce((a,b)=>a+b,0);const pool=sum>3?MOOD.good:sum<0?MOOD.bad:MOOD.mid;placeCloud(pool[Math.floor(Math.random()*pool.length)],n.scene,n);
    const d=Object.entries(o.fx).filter(([,v])=>v).map(([k,v])=>`<span class="delta ${v>0?'up':'down'}">${v>0?'+':'−'}${Math.abs(v)} ${STATN[k]}</span>`).join('');
    $('#pQuest').innerHTML=`<div class="qhead"><div><div class="eyebrow">${esc(ch.title)} · ты выбрал</div><h2 class="q">${esc(o.t)}</h2></div>${statsHTML()}</div><p class="resp">${esc(o.r)}</p><div class="deltas">${d||'<span class="delta">Без изменений</span>'}</div><button class="btn red" id="bNext">${o.next==='END'?'К забегу: '+esc(RACES[Q.ch].name)+' →':'Дальше →'}</button>`;
    $('#bNext').onclick=nextNode;$('#bNext').focus({preventScroll:true});}}
function choose(i){if(Q.opt)return;const o=curNode().opts[i];if(!o)return;Q.opt=o;for(const [k,v] of Object.entries(o.fx))G.stats[k]=clamp(G.stats[k]+v,0,100);save();beep(Object.values(o.fx).reduce((a,b)=>a+b,0)>=0?740:260,.12,'triangle',.06);renderQuest();}
function nextNode(){const o=Q.opt;Q.opt=null;if(o.next==='END'){G.step=Q.ch*2+1;save();showIntro(Q.ch,false);}else{Q.node=o.next;renderQuest();}}

function showIntro(i,isReplay){mode='intro';replay=isReplay;raceIdx=i;paused=false;hideStageOverlays();const race=RACES[i];R=makeRace(race);renderRoute();const st=G.stats;
  $('#pIntro').innerHTML=`<div class="eyebrow">Забег ${i+1} из 5 · номер ${race.bib}</div><h2>${esc(race.name)}</h2><p class="fact">${esc(race.fact)}</p>
  <div class="cols"><div><div class="eyebrow">Задания тренера</div><ul class="tlist">${R.tasks.map(t=>`<li><span class="st"></span><span class="tx">${esc(t.label)}</span></li>`).join('')}</ul></div>
  <div><div class="eyebrow">Твоя готовность</div><div style="margin:6px 0 12px">${statsHTML()}</div><div class="keys"><div>Запас энергии: <b>${Math.round(R.maxE)}</b>. Пункты питания — каждые 5 км.</div><div><kbd>Пробел</kbd> прыжок через препятствия</div><div><kbd>←</kbd> <kbd>→</kbd> темп, следи за пульсом</div><div><kbd>E</kbd> действие: вода, банан, помощь, фото</div></div></div></div>
  <div class="row" style="margin-top:18px"><button class="btn red" id="bGo">На старт</button>${isReplay?'<button class="btn ghost" id="bBack">Назад</button>':''}</div>`;
  showPanel('pIntro');$('#bGo').onclick=startRace;const bb=$('#bBack');if(bb)bb.onclick=goTitle;}
function startRace(){mode='race';paused=false;showPanel('pRace');$('#bPause').hidden=false;tasksDirty=true;setCoach('Встань в стартовый коридор. Сейчас дадут старт!');renderTasks();try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(e){}}
function renderTasks(){$('#tasks').innerHTML=R.tasks.map(t=>{let live='';if(t.type==='pulse'&&t.totT>0)live=` <span class="live">${Math.round(t.inT/t.totT*100)}% в зоне</span>`;if(t.type==='fans'&&t.sp.count)live=` <span class="live">${t.sp.count}/3</span>`;return `<li class="${t.status}"><span class="st">${t.status==='done'?'✓':t.status==='fail'?'×':''}</span><span><span class="tx">${esc(t.label)}</span>${live}</span></li>`;}).join('');tasksDirty=false;}
let hudT=0;
function updateHud(dt){hudT+=dt;if(hudT<.1)return;hudT=0;const km=Math.min(42.195,kmOf(R.dist));$('#hKm').innerHTML=km.toFixed(1)+'<small> / 42.2 км</small>';$('#hTime').textContent=fmtT(R.sim);const hr=Math.round(R.hr);const el=$('#hHr');el.textContent=hr;el.className='v '+(hr>172?'zone-hi':hr<140?'zone-lo':'zone-ok');
  const p=R.speed>20?clamp(450-(R.speed-200)*.62,200,900):0;$('#hPace').innerHTML=fmtPace(p)+'<small> /км</small>';const e=R.energy/R.maxE;$('#hEn').style.width=(e*100)+'%';$('#hEn').style.background=e<.18?'#ff7b62':e<.4?'#ffb547':'#6ad08f';$('#hEnN').textContent=Math.round(R.energy)+(R.energy<15?' · «стена»!':'');
  $('#pMark').style.left=(R.pace*100)+'%';$('#paceLbl').textContent=R.pace<.35?'лёгкий':R.pace<.68?'средний':R.pace<.85?'быстрый':'на пределе';
  const a=nearAction(),pr=$('#prompt');if(a){pr.innerHTML='<kbd>E</kbd>'+esc(a.label);pr.hidden=false;}else pr.hidden=true;
  if(tasksDirty)renderTasks();}

function showResult(){mode='result';$('#bPause').hidden=true;$('#prompt').hidden=true;const race=R.race,i=raceIdx;const done=R.tasks.filter(t=>t.status==='done').length,total=R.tasks.length;const stars=done>=total?3:done/total>=.6?2:1;
  const prev=G.results[i];G.results[i]={time:R.finalTime,best:prev?Math.min(prev.best,R.finalTime):R.finalTime,done:Math.max(done,prev?prev.done:0),total,stars:Math.max(stars,prev?prev.stars:0)};
  if(!replay){G.step=i*2+2;const gain=Math.round(2+done);G.stats.form=clamp(G.stats.form+gain,0,100);}save();renderRoute();
  $('#pResult').innerHTML=`<div class="rhead"><div class="medal" style="--rib:${race.accent}">${race.short}</div><div style="flex:1;min-width:220px"><div class="eyebrow">Финиш · ${esc(race.city)}</div><h2>${esc(race.name)}</h2><div class="rtime">${fmtT(R.finalTime)}</div><div class="stars">${[0,1,2].map(k=>`<span class="${k<stars?'on':''}">★</span>`).join('')}</div>
  ${!replay?`<p style="margin:6px 0 0;color:var(--ink-soft)">Опыт марафона: +${2+done} к форме.</p>`:''}</div></div>
  <div class="eyebrow" style="margin-top:16px">Задания тренера · ${done} из ${total}</div><ul class="tlist">${R.tasks.map(t=>`<li class="${t.status}"><span class="st">${t.status==='done'?'✓':'×'}</span><span class="tx">${esc(t.label)}</span></li>`).join('')}</ul>
  <div class="row" style="margin-top:18px">${replay?'<button class="btn red" id="bMenu2">В меню</button>':`<button class="btn red" id="bNext2">${i===4?'Финал истории →':'Следующая глава →'}</button>`}<button class="btn ghost" id="bAgain">Пробежать ещё раз</button></div>`;
  showPanel('pResult');const n2=$('#bNext2');if(n2)n2.onclick=()=>startStep(G.step);const m2=$('#bMenu2');if(m2)m2.onclick=goTitle;$('#bAgain').onclick=()=>showIntro(i,true);}

function showEnd(){mode='end';hideStageOverlays();renderRoute();const n={pose:'sit',outfit:'kit',props:['medals5']};Q={endNode:n};placeCloud('Пять марафонов. А начиналось всё с дивана.','room',n);
  const tot=G.results.reduce((a,r)=>a+(r?r.done:0),0),all=G.results.reduce((a,r)=>a+(r?r.total:0),0);
  $('#pEnd').innerHTML=`<div class="eyebrow">Финал</div><h2 class="q">Пять медалей на стене</h2><p style="margin:0 0 12px;max-width:65ch">Задания тренера: ${tot} из ${all}. Итоговая форма ${G.stats.form}, здоровье ${G.stats.health}, тактика ${G.stats.head}.</p>
  <div class="legs">${RACES.map((r,i)=>{const res=G.results[i];return `<div class="legrow"><div><div class="nm">${esc(r.name)}</div><div class="sub">${res?'Задания '+res.done+'/'+res.total+' · '+'★'.repeat(res.stars):''}</div></div><div class="tm">${res?fmtT(res.best):'—'}</div><button class="btn ghost" data-replay="${i}">Перебежать</button></div>`;}).join('')}</div>
  <div class="row" style="margin-top:18px"><button class="btn red" id="bNew2">Новая игра</button><button class="btn ghost" id="bMenu3">В меню</button></div>`;
  showPanel('pEnd');$('#pEnd').querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>showIntro(+b.dataset.replay,true));$('#bNew2').onclick=()=>{G={stats:{form:20,health:60,head:20},snap:null,step:0,results:[],mute:G.mute};save();startStep(0);};$('#bMenu3').onclick=goTitle;}

/* ================= INPUT ================= */
function setPause(v){if(mode!=='race')return;paused=v;$('#pauseov').hidden=!v;}
addEventListener('keydown',e=>{const k=e.key;
  if(mode==='race'){if(k===' '||k==='ArrowUp'||k==='w'||k==='W'||k==='ц'||k==='Ц'){e.preventDefault();if(!paused)doJump();}
    else if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ф'){e.preventDefault();keys.left=true;}
    else if(k==='ArrowRight'||k==='d'||k==='D'||k==='в'){e.preventDefault();keys.right=true;}
    else if(k==='e'||k==='E'||k==='у'||k==='У'||k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();if(!paused)doAction();}
    else if(k==='p'||k==='P'||k==='Escape'||k==='з'){setPause(!paused);}}
  else if(mode==='quest'&&!Q.opt&&/^[1-4]$/.test(k)){choose(+k-1);}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ф')keys.left=false;if(k==='ArrowRight'||k==='d'||k==='D'||k==='в')keys.right=false;});
function hold(id,key){const b=$(id);const on=e=>{e.preventDefault();keys[key]=true;b.classList.add('on');},off=()=>{keys[key]=false;b.classList.remove('on');};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));}
hold('#cSlow','left');hold('#cFast','right');
$('#cJump').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused)doJump();});
$('#cAct').addEventListener('pointerdown',e=>{e.preventDefault();if(!paused)doAction();});
stage.addEventListener('pointerdown',e=>{if(mode==='race'&&!paused&&e.target===cv)doJump();});
$('#bPause').onclick=()=>setPause(!paused);$('#bResume').onclick=()=>setPause(false);$('#bQuit').onclick=()=>{paused=false;goTitle();};
$('#bMenu').onclick=goTitle;
function syncMute(){$('#bMute').textContent='Звук: '+(G.mute?'выкл':'вкл');}
$('#bMute').onclick=()=>{G.mute=!G.mute;save();syncMute();};syncMute();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='race')setPause(true);});

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.setTransform(SC,0,0,SC,0,0);
  if(mode==='title'){DEMO.dist+=330*dt;DEMO.speed=330;DEMO.phase+=dt*330/40;DEMO.t+=dt;if(DEMO.dist>TOTAL-1000)DEMO.dist=0;stepNpcs.call(null,dt);stepParts(dt);drawRaceWorld(DEMO);}
  else if(mode==='quest'){const n=curNode();drawScene(n.scene,n,now/1000);}
  else if(mode==='end'){drawScene('room',Q.endNode,now/1000);}
  else if(mode==='intro'){stepNpcs(0);drawRaceWorld(R);}
  else if(mode==='race'||mode==='result'){if(!paused)updateRace(dt);drawRaceWorld(R);if(mode==='race')updateHud(dt);}
  requestAnimationFrame(loop);}
goTitle();
requestAnimationFrame(loop);
</script>
